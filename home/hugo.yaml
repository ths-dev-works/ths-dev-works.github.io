baseURL: "https://ths-dev-works.github.io/"
title: "THS Dev Works"
theme: "PaperMod"

# Multi-Language
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    title: "THS Dev Works"
    menu:
      main:
        - identifier: services
          name: Services
          url: /services/
          weight: 10
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 20
        - identifier: about
          name: About / Stack
          url: /about/
          weight: 30
    params:
      profileMode:
        buttons:
          - name: Services
            url: /services/
          - name: Contact
            url: "mailto:ths.dev.works@gmail.com"
  pt:
    languageName: "Português"
    weight: 2
    title: "THS Dev Works"
    menu:
      main:
        - identifier: services
          name: Serviços
          url: /pt/services/
          weight: 10
        - identifier: posts
          name: Posts
          url: /pt/posts/
          weight: 20
        - identifier: about
          name: Sobre / Stack
          url: /pt/about/
          weight: 30
    params:
      profileMode:
        buttons:
          - name: Serviços
            url: /pt/services/
          - name: Contacto
            url: "mailto:ths.dev.works@gmail.com"

# SEO
enableRobotsTXT: true
canonicalURL: true
build:
  writeStats: true

# Sitemap
sitemap:
  changefreq: monthly
  filename: sitemap.xml
  priority: 0.5

# Permalinks
permalinks:
  posts: /:year/:month/:slug/

# Privacy
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: false
    anonymizeIP: true
    respectDoNotTrack: true

# Security / CSP
security:
  csp:
    defaultSrc: ["'self'"]
    scriptSrc: ["'self'", "'unsafe-inline'", "'unsafe-eval'", "https://www.google-analytics.com", "https://giscus.app", "https://plausible.io"]
    styleSrc: ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
    fontSrc: ["'self'", "https://fonts.gstatic.com"]
    imgSrc: ["'self'", "data:", "https:", "https://www.google-analytics.com"]
    connectSrc: ["'self'", "https://www.google-analytics.com", "https://giscus.app", "https://plausible.io"]
    frameSrc: ["'self'", "https://giscus.app", "https://www.youtube.com"]

minify:
  disableXML: true
  minifyOutput: true

# Syntax Highlighting
markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true

# Outputs (RSS & JSON)
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Global Parameters
params:
  env: production
  description: "Go Specialist & Technical Advisor. Specialized in backend development, microservices, SRE, and Platform Engineering. Expert in Go, Kubernetes, cloud infrastructure, and scalable systems."
  author: "Tiago Simões"
  keywords: ["Go Specialist", "Golang", "Technical Advisor", "SRE", "Platform Engineering", "Microservices", "Kubernetes", "Backend Development", "Cloud Infrastructure", "DevOps"]
  defaultTheme: auto # auto, dark, light
  
  # Profile Mode (shared across languages)
  profileMode:
    enabled: true
    title: "Tiago Simões"
    subtitle: "Go Specialist • Technical Advisor"
    imageUrl: "/images/avatar.png"
    imageWidth: 120
    imageHeight: 120
  
  # Assets
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
  
  # Social Icons
  socialIcons:
    - name: linkedin
      url: https://linkedin.com/in/tiago17546
    - name: github
      url: https://github.com/ths-dev-works
    - name: email
      url: mailto:ths.dev.works@gmail.com

  # UI/UX Settings
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true
  
  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
  
  # Comments (Giscus)
  comments:
    enabled: true
    provider: giscus
    giscus:
      repo: "ths-dev-works/ths-dev-works"
      repoId: ""
      category: "Announcements"
      categoryId: ""
      mapping: "pathname"
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: "bottom"
      lang: "en"
      theme: "preferred_color_scheme"
  
  # Edit Post Link
  editPost:
    URL: "https://github.com/ths-dev-works/ths-dev-works/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true
  
  # Footer
  footer:
    text: "Built with Go & Hugo."

  # SEO / OpenGraph Images
  images: ["images/cover.jpg"]
  
  # SEO Enhancements
  enableEmoji: false
  ShowBreadCrumbs: true
  
  # Open Graph / Twitter Cards
  ogTitle: "THS Dev Works - Go Specialist & Technical Advisor"
  ogDescription: "Go Specialist & Technical Advisor. Specialized in backend development, microservices, SRE, and Platform Engineering."
  ogImage: "images/cover.jpg"
  ogSiteName: "THS Dev Works"
  
  # Additional SEO
  mainSections: []
  disableSpecial1stPost: false
  disableScrollToTop: false
  
  # Analytics / Verification
  analytics:
    google:
      SiteVerificationTag: "Qv4cFg7MaUWT7Y4EmgX-dIYP-z-ZHXC35_hav3PvSW8"