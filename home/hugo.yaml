baseURL: https://ths-dev-works.github.io
title: THS Dev Works
theme: PaperMod

# Multi-Language
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    title: "THS Dev Works"
    menu:
      main:
        - identifier: services
          name: Services
          url: /services/
          weight: 10
        - identifier: about
          name: About / Stack
          url: /about/
          weight: 30
    params:
      profileMode:
        enabled: true
        title: "Tiago Simões"
        subtitle: "Go Developer • Technical Advisor"
        imageUrl: "/images/avatar.png"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: Services
            url: /en/services/
          - name: Contact
            url: "mailto:ths.dev.works@gmail.com"
  pt:
    languageName: "Português"
    weight: 2
    title: "THS Dev Works"
    menu:
      main:
        - identifier: services
          name: Serviços
          url: /pt/services/
          weight: 10
        - identifier: about
          name: Sobre / Stack
          url: /pt/about/
          weight: 30
    params:
      profileMode:
        enabled: true
        title: "Tiago Simões"
        subtitle: "Go Developer • Technical Advisor"
        imageUrl: "/images/avatar.png"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: Serviços
            url: /pt/services/
          - name: Contacto
            url: "mailto:ths.dev.works@gmail.com"

# SEO
enableRobotsTXT: true
canonicalURL: true
build:
  writeStats: true

minify:
  disableXML: true
  minifyOutput: true

# Syntax Highlighting
markup:
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true

# Outputs (RSS & JSON)
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Global Parameters
params:
  env: production
  description: "Go Development, and Technical Advisor Services."
  author: "Tiago Simões"
  defaultTheme: auto # auto, dark, light
  
  # Assets
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
  
  # Social Icons
  socialIcons:
    - name: linkedin
      url: https://linkedin.com/in/tiago17546
    - name: github
      url: https://github.com/ths-dev-works
    - name: email
      url: mailto:ths.dev.works@gmail.com

  # UI/UX Settings
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: trueo
  
  # Footer
  footer:
    text: "Built with Go & Hugo."

  # SEO / OpenGraph Images
  images: ["images/cover.png"]